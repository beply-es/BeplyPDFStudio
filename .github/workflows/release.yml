name: Release Plugin

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: beplypdfstudio-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  verify_tests:
    name: Verify Tests Workflow
    timeout-minutes: 20
    runs-on: ${{ vars.BEPLY_GHA_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Wait for Tests workflow on this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_REF_NAME: ${{ github.ref_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          repository = os.environ["REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          target_ref_name = os.environ["TARGET_REF_NAME"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          token = os.environ["GITHUB_TOKEN"]
          api_url = f"https://api.github.com/repos/{repository}/actions/runs?head_sha={target_sha}&per_page=100"
          deadline = time.time() + 19 * 60

          def fetch_runs():
              request = urllib.request.Request(
                  api_url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "beplypdfstudio-release-gate",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          while time.time() < deadline:
              runs = [
                  run for run in fetch_runs().get("workflow_runs", [])
                  if run.get("name") == "Tests"
                  and int(run.get("id", 0)) != current_run_id
                  and run.get("head_branch") == target_ref_name
              ]
              if not runs:
                  print("Waiting for Tests workflow to start on this commit...")
                  time.sleep(15)
                  continue

              run = runs[0]
              status = run.get("status")
              conclusion = run.get("conclusion")
              print(f"Tests workflow status={status} conclusion={conclusion} url={run.get('html_url', '')}")
              if status != "completed":
                  time.sleep(15)
                  continue
              sys.exit(0 if conclusion == "success" else 1)

          print("Timed out waiting for Tests workflow to complete successfully.", file=sys.stderr)
          sys.exit(1)
          PY

  release:
    name: Publish Candidate
    needs: verify_tests
    timeout-minutes: 15
    runs-on: ${{ vars.BEPLY_GHA_RUNNER || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Parse facturascripts.ini
        id: ini
        run: |
          set -euo pipefail
          parse_field() {
            grep -E "^${1}\s*=" facturascripts.ini | head -1 | sed 's/[^=]*=\s*//' | sed 's/^"\(.*\)"$/\1/' | xargs
          }
          PLUGIN_NAME="$(parse_field name)"
          PLUGIN_VERSION="$(parse_field version)"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            ASSET_NAME="${PLUGIN_NAME}-dev-${PLUGIN_VERSION}.zip"
          else
            ASSET_NAME="${PLUGIN_NAME}-v${PLUGIN_VERSION}.zip"
          fi
          {
            echo "version=${PLUGIN_VERSION}"
            echo "name=${PLUGIN_NAME}"
            echo "asset_name=${ASSET_NAME}"
            echo "min_version=$(parse_field min_version)"
            echo "max_version=$(parse_field max_version)"
            echo "min_php=$(parse_field min_php)"
            echo "description=$(parse_field description)"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release ref
        env:
          PLUGIN_VERSION: ${{ steps.ini.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" = "v${PLUGIN_VERSION}" ]; then
            exit 0
          fi
          echo "::error::Ref ${GITHUB_REF} must be main or the exact tag v${PLUGIN_VERSION}"
          exit 1

      - name: Build plugin zip
        env:
          PLUGIN_NAME: ${{ steps.ini.outputs.name }}
          PLUGIN_ASSET_NAME: ${{ steps.ini.outputs.asset_name }}
        run: |
          set -euo pipefail
          mkdir -p "/tmp/build/${PLUGIN_NAME}"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.venv' \
            --exclude='.phpunit.result.cache' \
            --exclude='Tests' \
            --exclude='scripts' \
            --exclude='test-results' \
            --exclude='.gitignore' \
            ./ "/tmp/build/${PLUGIN_NAME}/"
          cd /tmp/build
          zip -r "/tmp/${PLUGIN_ASSET_NAME}" "${PLUGIN_NAME}/"
          test -s "/tmp/${PLUGIN_ASSET_NAME}"

      - name: Publish dev provenance release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: "main-${{ github.sha }}"
          target_commitish: "${{ github.sha }}"
          name: "${{ steps.ini.outputs.name }} dev ${{ github.sha }}"
          body: |
            Candidato inmutable de desarrollo para `${{ github.sha }}`.

            Estos bytes se publican antes de su ingesta para que la plataforma
            pueda verificar procedencia, checksum y tamaño de forma fail-closed.
          prerelease: true
          make_latest: false
          overwrite_files: false
          fail_on_unmatched_files: true
          files: /tmp/${{ steps.ini.outputs.asset_name }}

      - name: Resolve immutable dev provenance ZIP
        if: github.ref == 'refs/heads/main'
        id: dev_provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLUGIN_ASSET_NAME: ${{ steps.ini.outputs.asset_name }}
        run: |
          set -euo pipefail
          python3 scripts/ci/download_provenance_release_asset.py \
            --repository "${GITHUB_REPOSITORY}" \
            --source-tag "main-${GITHUB_SHA}" \
            --source-sha "${GITHUB_SHA}" \
            --asset-name "${PLUGIN_ASSET_NAME}" \
            --destination "/tmp/provenance/${PLUGIN_ASSET_NAME}" \
            --attempts 6 \
            --github-output "$GITHUB_OUTPUT"

      - name: Preserve dev candidate artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ${{ steps.ini.outputs.name }}-dev-${{ steps.ini.outputs.version }}
          path: ${{ steps.dev_provenance.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload candidate to Beply dev
        if: github.ref == 'refs/heads/main'
        env:
          BEPLY_DEV_API_URL: ${{ secrets.BEPLY_DEV_API_URL }}
          BEPLY_DEV_CI_TOKEN: ${{ secrets.BEPLY_DEV_CI_TOKEN }}
          PLUGIN_NAME: ${{ steps.ini.outputs.name }}
          PLUGIN_VERSION: ${{ steps.ini.outputs.version }}
          PLUGIN_ZIP: ${{ steps.dev_provenance.outputs.zip_path }}
          EXPECTED_CHECKSUM: ${{ steps.dev_provenance.outputs.sha256 }}
          EXPECTED_BYTES: ${{ steps.dev_provenance.outputs.size }}
          SOURCE_TAG: main-${{ github.sha }}
          SOURCE_URL: https://github.com/${{ github.repository }}/releases/tag/main-${{ github.sha }}
          SOURCE_PUBLISHED_AT: ${{ steps.dev_provenance.outputs.published_at }}
        run: |
          set -euo pipefail
          if [ -z "$BEPLY_DEV_CI_TOKEN" ]; then
            echo "::error::BEPLY_DEV_CI_TOKEN must be configured for dev platform upload. Immutable provenance bytes were preserved, but catalog ingestion is unverified."
            exit 1
          fi

          API_URL="${BEPLY_DEV_API_URL:-https://api.services.devbeply.es}"
          test -s "$PLUGIN_ZIP"
          read -r SHA256_HEX _ < <(sha256sum "$PLUGIN_ZIP")
          ZIP_CHECKSUM="sha256:${SHA256_HEX}"
          ZIP_BYTES="$(stat -c %s "$PLUGIN_ZIP")"
          test "$ZIP_CHECKSUM" = "$EXPECTED_CHECKSUM" || { echo "::error::Downloaded DEV ZIP checksum drift"; exit 1; }
          test "$ZIP_BYTES" = "$EXPECTED_BYTES" || { echo "::error::Downloaded DEV ZIP size drift"; exit 1; }

          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${BEPLY_DEV_CI_TOKEN}" \
            -F "file=@${PLUGIN_ZIP}" \
            -F "sourceRepoFullName=${GITHUB_REPOSITORY}" \
            -F "sourceBranch=main" \
            -F "sourceReleaseTag=${SOURCE_TAG}" \
            -F "sourceReleaseUrl=${SOURCE_URL}" \
            -F "sourcePublishedAt=${SOURCE_PUBLISHED_AT}" \
            "${API_URL}/api/v1/plugins/release")
          HTTP_CODE="${RESPONSE##*$'\n'}"
          BODY="${RESPONSE%$'\n'*}"
          UPLOAD_CREATED=false
          if [[ "$HTTP_CODE" =~ ^[0-9]{3}$ ]] && [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            printf '%s' "$BODY" | jq -e \
              --arg fs_name "$PLUGIN_NAME" \
              --arg version "$PLUGIN_VERSION" \
              '.success == true and .data.pluginName == $fs_name and .data.version == $version' >/dev/null \
              || { echo "::error::Dev upload response identity mismatch"; exit 1; }
            UPLOAD_CREATED=true
          elif [ "$HTTP_CODE" = "409" ] && printf '%s' "$BODY" | jq -e '.code == "SUBMISSION_PENDING"' >/dev/null; then
            echo "::notice::The exact version already has a pending submission; validating its immutable identity."
          else
            echo "::error::Dev platform upload failed (HTTP ${HTTP_CODE}): ${BODY}"
            exit 1
          fi

          PENDING_JSON=$(curl -sSf \
            -H "Authorization: Bearer ${BEPLY_DEV_CI_TOKEN}" \
            "${API_URL}/api/v1/plugins/pending-releases")
          # pending-releases exposes the manifest FS name as pluginName.
          MATCHES=$(printf '%s' "$PENDING_JSON" | jq \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg tag "$SOURCE_TAG" \
            --arg fs_name "$PLUGIN_NAME" \
            --arg version "$PLUGIN_VERSION" \
            --arg checksum "$ZIP_CHECKSUM" \
            --arg bytes "$ZIP_BYTES" \
            '[.data.releases[]? | select(
              (.sourceRepoFullName // "") == $repo
              and (.sourceReleaseTag // "") == $tag
              and (.pluginName // "") == $fs_name
              and (.version // "") == $version
              and (.checksum // "") == $checksum
              and (((.fileSize // -1) | tostring) == $bytes)
            )] | length')
          if [ "$MATCHES" != "1" ]; then
            echo "::error::Dev readback expected exactly 1 pending row for repo=${GITHUB_REPOSITORY} tag=${SOURCE_TAG} fsName=${PLUGIN_NAME} version=${PLUGIN_VERSION} checksum=${ZIP_CHECKSUM} bytes=${ZIP_BYTES}; found ${MATCHES}."
            exit 1
          fi

          echo "::notice::Plugin confirmed as one exact pending DEV release."
          if [ "$UPLOAD_CREATED" = "true" ]; then
            printf '%s' "$BODY" | jq -r '.data | "Plugin: \(.pluginName) | Version: \(.version) | Status: \(.releaseStatus)"'
          fi

      - name: Generate release notes
        if: github.ref_type == 'tag'
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..${GITHUB_REF_NAME}" --pretty=format:"- %s (%h)" --no-merges)
          else
            NOTES=$(git log "${GITHUB_REF_NAME}" --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "${NOTES:-- Release inicial}"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.ini.outputs.name }} ${{ github.ref_name }}
          body: |
            Version `${{ steps.ini.outputs.version }}` · FacturaScripts `${{ steps.ini.outputs.min_version }}`–`${{ steps.ini.outputs.max_version || 'sin límite' }}` · PHP `${{ steps.ini.outputs.min_php }}`.

            ${{ steps.changelog.outputs.notes }}
          files: /tmp/${{ steps.ini.outputs.asset_name }}

      - name: Upload candidate to Beply production
        if: github.ref_type == 'tag'
        env:
          BEPLY_API_URL: ${{ secrets.BEPLY_API_URL }}
          BEPLY_CI_TOKEN: ${{ secrets.BEPLY_CI_TOKEN }}
          PLUGIN_NAME: ${{ steps.ini.outputs.name }}
          PLUGIN_VERSION: ${{ steps.ini.outputs.version }}
          PLUGIN_ASSET_NAME: ${{ steps.ini.outputs.asset_name }}
        run: |
          set -euo pipefail
          if [ -z "$BEPLY_API_URL" ] || [ -z "$BEPLY_CI_TOKEN" ]; then
            echo "::warning::Production platform credentials are not configured. GitHub release was created, but no platform upload was attempted."
            exit 0
          fi
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${BEPLY_CI_TOKEN}" \
            -F "file=@/tmp/${PLUGIN_ASSET_NAME}" \
            -F "sourceRepoFullName=${{ github.repository }}" \
            -F "sourceReleaseTag=${GITHUB_REF_NAME}" \
            -F "sourceReleaseUrl=https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}" \
            -F "sourcePublishedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${BEPLY_API_URL}/api/v1/plugins/release")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "$BODY" | jq -r '.data | "Plugin: \(.pluginName) | Version: \(.version) | Status: \(.releaseStatus)"'
            exit 0
          fi
          if [ "$HTTP_CODE" = "409" ] && echo "$BODY" | grep -q VERSION_ALREADY_APPROVED; then
            echo "::notice::Version already approved in production."
            exit 0
          fi
          echo "::error::Production platform upload failed (HTTP $HTTP_CODE): $BODY"
          exit 1
