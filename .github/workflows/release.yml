name: Release Plugin

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: beplypdfstudio-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  verify_tests:
    name: Verify Tests Workflow
    timeout-minutes: 20
    runs-on: ${{ vars.BEPLY_GHA_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Wait for Tests workflow on this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_REF_NAME: ${{ github.ref_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          repository = os.environ["REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          target_ref_name = os.environ["TARGET_REF_NAME"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          token = os.environ["GITHUB_TOKEN"]
          api_url = f"https://api.github.com/repos/{repository}/actions/runs?head_sha={target_sha}&per_page=100"
          deadline = time.time() + 19 * 60

          def fetch_runs():
              request = urllib.request.Request(
                  api_url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "beplypdfstudio-release-gate",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          while time.time() < deadline:
              runs = [
                  run for run in fetch_runs().get("workflow_runs", [])
                  if run.get("name") == "Tests"
                  and int(run.get("id", 0)) != current_run_id
                  and run.get("head_branch") == target_ref_name
              ]
              if not runs:
                  print("Waiting for Tests workflow to start on this commit...")
                  time.sleep(15)
                  continue

              run = runs[0]
              status = run.get("status")
              conclusion = run.get("conclusion")
              print(f"Tests workflow status={status} conclusion={conclusion} url={run.get('html_url', '')}")
              if status != "completed":
                  time.sleep(15)
                  continue
              sys.exit(0 if conclusion == "success" else 1)

          print("Timed out waiting for Tests workflow to complete successfully.", file=sys.stderr)
          sys.exit(1)
          PY

  release:
    name: Publish Candidate
    needs: verify_tests
    timeout-minutes: 15
    runs-on: ${{ vars.BEPLY_GHA_RUNNER || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Parse facturascripts.ini
        id: ini
        run: |
          set -euo pipefail
          parse_field() {
            grep -E "^${1}\s*=" facturascripts.ini | head -1 | sed 's/[^=]*=\s*//' | sed 's/^"\(.*\)"$/\1/' | xargs
          }
          PLUGIN_NAME="$(parse_field name)"
          PLUGIN_VERSION="$(parse_field version)"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            ASSET_NAME="${PLUGIN_NAME}-dev-${PLUGIN_VERSION}.zip"
          else
            ASSET_NAME="${PLUGIN_NAME}-v${PLUGIN_VERSION}.zip"
          fi
          {
            echo "version=${PLUGIN_VERSION}"
            echo "name=${PLUGIN_NAME}"
            echo "asset_name=${ASSET_NAME}"
            echo "min_version=$(parse_field min_version)"
            echo "max_version=$(parse_field max_version)"
            echo "min_php=$(parse_field min_php)"
            echo "description=$(parse_field description)"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release ref
        env:
          PLUGIN_VERSION: ${{ steps.ini.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" = "v${PLUGIN_VERSION}" ]; then
            exit 0
          fi
          echo "::error::Ref ${GITHUB_REF} must be main or the exact tag v${PLUGIN_VERSION}"
          exit 1

      - name: Build plugin zip
        env:
          PLUGIN_NAME: ${{ steps.ini.outputs.name }}
          PLUGIN_ASSET_NAME: ${{ steps.ini.outputs.asset_name }}
        run: |
          set -euo pipefail
          mkdir -p "/tmp/build/${PLUGIN_NAME}"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.venv' \
            --exclude='.phpunit.result.cache' \
            --exclude='Tests' \
            --exclude='scripts' \
            --exclude='test-results' \
            --exclude='.gitignore' \
            ./ "/tmp/build/${PLUGIN_NAME}/"
          cd /tmp/build
          zip -r "/tmp/${PLUGIN_ASSET_NAME}" "${PLUGIN_NAME}/"
          test -s "/tmp/${PLUGIN_ASSET_NAME}"

      - name: Publish dev provenance release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: "main-${{ github.sha }}"
          target_commitish: "${{ github.sha }}"
          name: "${{ steps.ini.outputs.name }} dev ${{ github.sha }}"
          body: |
            Candidato inmutable de desarrollo para `${{ github.sha }}`.

            Estos bytes se publican antes de su ingesta para que la plataforma
            pueda verificar procedencia, checksum y tamaño de forma fail-closed.
          prerelease: true
          make_latest: false
          overwrite_files: false
          fail_on_unmatched_files: true
          files: /tmp/${{ steps.ini.outputs.asset_name }}

      - name: Resolve immutable dev provenance ZIP
        if: github.ref == 'refs/heads/main'
        id: dev_provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLUGIN_ASSET_NAME: ${{ steps.ini.outputs.asset_name }}
        run: |
          set -euo pipefail
          python3 scripts/ci/download_provenance_release_asset.py \
            --repository "${GITHUB_REPOSITORY}" \
            --source-tag "main-${GITHUB_SHA}" \
            --source-sha "${GITHUB_SHA}" \
            --asset-name "${PLUGIN_ASSET_NAME}" \
            --destination "/tmp/provenance/${PLUGIN_ASSET_NAME}" \
            --attempts 6 \
            --github-output "$GITHUB_OUTPUT"

      - name: Preserve dev candidate artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ${{ steps.ini.outputs.name }}-dev-${{ steps.ini.outputs.version }}
          path: ${{ steps.dev_provenance.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload candidate to Beply dev
        if: github.ref == 'refs/heads/main'
        env:
          BEPLY_API_URL: ${{ secrets.BEPLY_DEV_API_URL }}
          BEPLY_DEV_CI_TOKEN: ${{ secrets.BEPLY_DEV_CI_TOKEN }}
          PLUGIN_ZIP: ${{ steps.dev_provenance.outputs.zip_path }}
          PLUGIN_FS_NAME: ${{ steps.ini.outputs.name }}
          PLUGIN_SLUG: beplypdfstudio
          PLUGIN_VERSION: ${{ steps.ini.outputs.version }}
          SOURCE_REPO_FULL_NAME: ${{ github.repository }}
          SOURCE_BRANCH: main
          RELEASE_TRACK: main
          SOURCE_RELEASE_TAG: main-${{ github.sha }}
          SOURCE_RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/main-${{ github.sha }}
          SOURCE_PUBLISHED_AT: ${{ steps.dev_provenance.outputs.published_at }}
          EXPECTED_CHECKSUM: ${{ steps.dev_provenance.outputs.sha256 }}
          EXPECTED_FILE_SIZE: ${{ steps.dev_provenance.outputs.size }}
        run: |
          set -euo pipefail
          if [ -z "$BEPLY_DEV_CI_TOKEN" ]; then
            echo "::error::BEPLY_DEV_CI_TOKEN must be configured for dev platform upload. Immutable provenance bytes were preserved, but catalog ingestion is unverified."
            exit 1
          fi
          export BEPLY_CI_TOKEN="$BEPLY_DEV_CI_TOKEN"
          export BEPLY_API_URL="${BEPLY_API_URL:-https://api.services.devbeply.es}"
          bash scripts/ci/upload_catalog_release.sh

      - name: Generate release notes
        if: github.ref_type == 'tag'
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..${GITHUB_REF_NAME}" --pretty=format:"- %s (%h)" --no-merges)
          else
            NOTES=$(git log "${GITHUB_REF_NAME}" --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "${NOTES:-- Release inicial}"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.ini.outputs.name }} ${{ github.ref_name }}
          body: |
            Version `${{ steps.ini.outputs.version }}` · FacturaScripts `${{ steps.ini.outputs.min_version }}`–`${{ steps.ini.outputs.max_version || 'sin límite' }}` · PHP `${{ steps.ini.outputs.min_php }}`.

            ${{ steps.changelog.outputs.notes }}
          files: /tmp/${{ steps.ini.outputs.asset_name }}

      # La ingesta del artefacto en el catalogo de PRODUCCION no se hace aqui. El camino
      # canonico es el workflow beply-es/beply-k3s .github/workflows/prod-plugin-artifact-ingest.yml,
      # que valida pins exactos, carga la clave PROD desde SOPS y relee la fila creada.
      - name: Announce canonical production ingest path
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PLUGIN_NAME: ${{ steps.ini.outputs.name }}
          PLUGIN_VERSION: ${{ steps.ini.outputs.version }}
          ASSET_NAME: ${{ steps.ini.outputs.asset_name }}
        run: |
          set -euo pipefail
          echo "::notice::Immutable GitHub release ${RELEASE_TAG} published. This workflow does NOT ingest into the production catalog."
          echo "Canonical production ingest: dispatch beply-es/beply-k3s .github/workflows/prod-plugin-artifact-ingest.yml from refs/heads/main with:"
          echo "  source_kind=release_asset  source_repo=${GITHUB_REPOSITORY}  source_release_tag=${RELEASE_TAG}"
          echo "  source_sha=${GITHUB_SHA}  source_branch=main  release_track=main"
          echo "  plugin_name=${PLUGIN_NAME}  plugin_version=${PLUGIN_VERSION}  source_release_asset_name=${ASSET_NAME}"
          echo "  plus the exact source_release_asset_id, source_published_at, zip_sha256, zip_size"
          echo "  apply=true  confirm=INGEST_PROD_PLUGIN_ARTIFACT"
          echo "A green result here means the release exists, never that a production catalog row exists."
