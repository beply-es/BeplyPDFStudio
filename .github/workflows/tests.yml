name: Tests

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TZ: Europe/Madrid

concurrency:
  group: beplypdfstudio-tests-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}-{2}', github.event_name, github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  php84_compat:
    name: PHP 8.4 Compatibility and Unit
    timeout-minutes: 10
    runs-on: arc-public-studio

    steps:
      - name: Checkout Plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Select preinstalled PHP
        run: bash .github/ci/select-preinstalled-php.sh 8.4

      - name: Run PHP 8.4 compatibility scan
        run: php scripts/ci/php84-compat-scan.php "$PWD"

      - name: Run unit tests
        run: php Tests/run-unit.php

      - name: Check document export permission extension
        run: php Tests/run-export-permission-unit.php

      - name: Preserve failed HTTP transfer diagnostics without credentials
        run: php Tests/run-http-transport-diagnostics.php

      - name: Reject native HTTP entrypoints outside the synthetic root
        run: php Tests/run-http-runtime-root.php

      - name: Run provenance downloader tests
        run: python3 -m unittest scripts.ci.test_download_provenance_release_asset

      - name: Verify Noto font source contract
        run: python3 Tests/test_noto_font_source.py

      - name: Run catalog release witness tests
        run: python3 -m unittest scripts.ci.test_verify_release_witness scripts.ci.test_upload_catalog_release

      - name: Unit test one Tests run per SHA and draft PR gating
        run: |
          python3 .github/ci/test_tests_workflow_triggers.py
          python3 .github/ci/test_owned_runner_core_matrix.py

  lint:
    name: PHP Lint
    timeout-minutes: 10
    runs-on: arc-public-studio

    steps:
      - name: Checkout Plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Select preinstalled PHP
        run: bash .github/ci/select-preinstalled-php.sh 8.4

      - name: Lint PHP sources
        run: |
          find . \( -path './.git' -o -path './vendor' \) -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  runtime:
    name: Runtime FS ${{ matrix.core_version }} PostgreSQL
    strategy:
      fail-fast: false
      matrix:
        include:
          - core_version: '2025.71'
            core_sha: b4f2422e4a3f5931c7188214fb8e2196b80182b5
          - core_version: '2026.65'
            core_sha: 35eeafaf1f9aeb630f7f3bb995cdf6ccc522bb8f
          - core_version: '2026.72'
            core_sha: e38f65a60e46bd2aba6bf5e3c4e3e1ad8c4444cc
    timeout-minutes: 25
    if: github.event.pull_request.draft != true
    runs-on: arc-public-studio

    steps:
      - name: Checkout FacturaScripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          repository: NeoRazorX/facturascripts
          ref: ${{ matrix.core_sha }}
          path: facturascripts

      - name: Checkout Plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          path: facturascripts/Plugins/BeplyPDFStudio

      - name: Select preinstalled PHP
        run: bash facturascripts/Plugins/BeplyPDFStudio/.github/ci/select-preinstalled-php.sh 8.2

      - name: Install Composer dependencies
        working-directory: facturascripts
        run: |
          composer config platform.php 8.2.0
          composer install --no-interaction --prefer-dist

      - name: Verify exact Core source
        working-directory: facturascripts
        env:
          EXPECTED_CORE_SHA: ${{ matrix.core_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_CORE_SHA"

      - name: Start local PostgreSQL
        working-directory: facturascripts
        run: bash Plugins/BeplyPDFStudio/.github/ci/start-local-postgres.sh

      - name: Prepare config.php
        working-directory: facturascripts
        run: |
          cat > config.php << 'EOF'
          <?php
          define('FS_COOKIES_EXPIRE', 31536000);
          define('FS_ROUTE', '');
          define('FS_DB_TYPE', 'postgresql');
          define('FS_DB_HOST', '127.0.0.1');
          define('FS_DB_PORT', 5432);
          define('FS_DB_NAME', 'facturascripts');
          define('FS_DB_USER', 'postgres');
          define('FS_DB_PASS', '');
          define('FS_DB_FOREIGN_KEYS', true);
          define('FS_DB_TYPE_CHECK', true);
          define('FS_PGSQL_SSL', false);
          define('FS_PGSQL_ENDPOINT', false);
          define('FS_LANG', 'es_ES');
          define('FS_TIMEZONE', 'Europe/Madrid');
          define('FS_HIDDEN_PLUGINS', '');
          define('FS_DEBUG', false);
          define('FS_DISABLE_ADD_PLUGINS', false);
          define('FS_DISABLE_RM_PLUGINS', false);
          EOF

      - name: Prepare plugin runtime
        working-directory: facturascripts
        env:
          CI_PLUGIN_FOLDERS: BeplyPDFStudio
        run: php Plugins/BeplyPDFStudio/.github/ci/setup-runtime.php

      - name: Native PHPUnit against selected Core
        working-directory: facturascripts
        run: php vendor/bin/phpunit --configuration Plugins/BeplyPDFStudio/phpunit.xml.dist --testdox --fail-on-risky --fail-on-warning

      - name: Native hidden totals stay hidden in classic documents
        working-directory: facturascripts
        run: php Plugins/BeplyPDFStudio/Tests/run-hidden-totals.php

      - name: Opening a format design keeps what it prints
        working-directory: facturascripts
        env:
          BEPDF_SYNTHETIC_FORMAT_SEED_TEST: "1"
        run: |
          set -euo pipefail
          fixture="$(php Plugins/BeplyPDFStudio/Tests/ci/create-format-seed-fixture.php)"
          echo "${fixture}"
          env $(grep -E '^BEPDF_TEST_(FORMAT|INVOICE)=[0-9]+$' <<<"${fixture}") \
            php Plugins/BeplyPDFStudio/Tests/run-format-design-seed.php

      - name: Install PDF engine for receipt contracts
        working-directory: facturascripts/Plugins/BeplyPDFStudio
        run: |
          command -v gs
          gs --version
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check 'weasyprint==70.0'
          .venv/bin/weasyprint --version

      - name: Domiciled accounts in both PDF renderers
        working-directory: facturascripts
        run: php Plugins/BeplyPDFStudio/Tests/run-template.php

      - name: Native canonical tax subtotals and cache failure boundary
        working-directory: facturascripts
        env:
          BEPDF_SYNTHETIC_TAX_TEST: "1"
        run: php Plugins/BeplyPDFStudio/Tests/run-tax-subtotals-contract.php

      - name: Native HTTP export permissions and legacy exporter routing
        working-directory: facturascripts
        env:
          BEPDF_SYNTHETIC_HTTP_EXPORT_TEST: "1"
          BEPDF_HTTP_EXPECTED_DB: facturascripts
        run: php Plugins/BeplyPDFStudio/Tests/run-http-export-contract.php

      - name: Install page measurement tools
        run: |
          command -v convert
          command -v pdfinfo
          command -v pdftotext
          # Ubuntu blocks the PDF coder by default; the runtime image allows it.
          policy_dir="${RUNNER_TEMP}/imagemagick-policy"
          mkdir -p "${policy_dir}"
          printf '%s\n' '<policymap><policy domain="coder" rights="read|write" pattern="PDF" /></policymap>' > "${policy_dir}/policy.xml"
          echo "MAGICK_CONFIGURE_PATH=${policy_dir}" >> "$GITHUB_ENV"

      - name: Short documents print on one page
        working-directory: facturascripts
        env:
          BEPDF_SYNTHETIC_PAGINATION_TEST: "1"
        run: |
          export PATH="$PWD/Plugins/BeplyPDFStudio/.venv/bin:$PATH"
          php Plugins/BeplyPDFStudio/Tests/run-short-document-pagination.php

      - name: Framed report keeps 100 rows on at most three pages
        working-directory: facturascripts
        env:
          BEPDF_ONLY: legacy_framed
        run: |
          set -euo pipefail
          plugin="$PWD/Plugins/BeplyPDFStudio"
          fonts="$(mktemp -d "${RUNNER_TEMP}/bepdf-report-fonts.XXXXXX")"
          trap 'rm -rf -- "$fonts"' EXIT
          cp "$plugin"/Assets/Fonts/DejaVuSans*.ttf "$fonts/"
          curl -fsSL 'https://raw.githubusercontent.com/notofonts/noto-fonts/ffebf8c1ee449e544955a7e813c54f9b73848eac/hinted/ttf/NotoSans/NotoSans-Regular.ttf' -o "$fonts/NotoSans-Regular.ttf"
          echo 'b85c38ecea8a7cfb39c24e395a4007474fa5a4fc864f6ee33309eb4948d232d5  NotoSans-Regular.ttf' | (cd "$fonts" && sha256sum -c -)
          curl -fsSL 'https://raw.githubusercontent.com/notofonts/noto-fonts/ffebf8c1ee449e544955a7e813c54f9b73848eac/hinted/ttf/NotoSans/NotoSans-Bold.ttf' -o "$fonts/NotoSans-Bold.ttf"
          echo 'c976e4b1b99edc88775377fcc21692ca4bfa46b6d6ca6522bfda505b28ff9d6a  NotoSans-Bold.ttf' | (cd "$fonts" && sha256sum -c -)
          curl -fsSL 'https://raw.githubusercontent.com/notofonts/noto-fonts/ffebf8c1ee449e544955a7e813c54f9b73848eac/hinted/ttf/NotoSans/NotoSans-Italic.ttf' -o "$fonts/NotoSans-Italic.ttf"
          echo '36cff144df01309dab648bea71baff9bb074026914afe63aeacc8bc90b67a28b  NotoSans-Italic.ttf' | (cd "$fonts" && sha256sum -c -)
          curl -fsSL 'https://raw.githubusercontent.com/notofonts/noto-fonts/ffebf8c1ee449e544955a7e813c54f9b73848eac/hinted/ttf/NotoSans/NotoSans-BoldItalic.ttf' -o "$fonts/NotoSans-BoldItalic.ttf"
          echo '6edf4227ef0fa846aca70e86a307804ca4401741830f5b3af0f2554abe2b8466  NotoSans-BoldItalic.ttf' | (cd "$fonts" && sha256sum -c -)
          export BEPDF_CI_FONT_DIR="$fonts"
          export BEPDF_CI_CORE_DIR="$PWD" BEPDF_CI_SCRATCH="$fonts"
          "$plugin/.venv/bin/python" "$plugin/Tests/verify_noto_html_embedded_weights.py"
          "$plugin/.venv/bin/python" "$plugin/Tests/verify_noto_cezpdf_fonts.py"
          php -d auto_prepend_file="$plugin/.github/ci/bind-report-fonts.php" "$plugin/Tests/run-report-visual.php"

      - name: New and upgraded services get a default template
        working-directory: facturascripts
        env:
          BEPDF_SYNTHETIC_SEED_TEST: "1"
        run: php Plugins/BeplyPDFStudio/Tests/run-default-style-seed.php

      - name: Stop local PostgreSQL
        if: always()
        working-directory: facturascripts
        run: |
          if [ -n "${PGDATA_DIR:-}" ] && [ -f "${PGDATA_DIR}/postmaster.pid" ]; then
            if [ "${PG_RUN_AS_POSTGRES:-0}" = "1" ]; then
              runuser -u postgres -- env PATH="${PATH}" pg_ctl -D "${PGDATA_DIR}" -m fast stop
            else
              pg_ctl -D "${PGDATA_DIR}" -m fast stop
            fi
          fi
